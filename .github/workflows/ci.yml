name: CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

  # ==========================================
  # CI
  # ==========================================

  ci:
    name: CI - install, check, smoke test

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Syntax check
        run: node --check server.js

      - name: Smoke test
        run: npm test
        env:
          PORT: 3457


  # ==========================================
  # CD - STAGING
  # ==========================================

  cd-staging:
    name: CD - deploy to staging

    needs: ci

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    environment: staging

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}

          script: |

            echo "===================================="
            echo "Starting deployment"
            echo "===================================="

            # Load NVM
            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
            fi

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v


            # ----------------------------------
            # Create apps directory
            # ----------------------------------

            mkdir -p ~/apps

            cd ~/apps


            # ----------------------------------
            # Clone repository first time
            # ----------------------------------

            if [ ! -d "node-staging/.git" ]; then

              echo "Repository does not exist."
              echo "Cloning repository..."

              rm -rf node-staging

              git clone git@github.com:eemailkrishna/node-staging.git node-staging

            fi


            # ----------------------------------
            # Go to application
            # ----------------------------------

            cd ~/apps/node-staging


            # ----------------------------------
            # Get latest code
            # ----------------------------------

            echo "Pulling latest code..."

            git fetch origin main

            git reset --hard origin/main


            # ----------------------------------
            # Install dependencies
            # ----------------------------------

            echo "Installing dependencies..."

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi


            # ----------------------------------
            # Build if build script exists
            # ----------------------------------

            if npm run | grep -q " build"; then
              echo "Build script found. Running build..."
              npm run build
            else
              echo "No build script found. Skipping build."
            fi


            # ----------------------------------
            # Start / Restart PM2
            # ----------------------------------

            echo "Checking PM2..."

            if pm2 describe node-staging > /dev/null 2>&1; then

              echo "Application already exists in PM2."
              echo "Restarting..."

              pm2 restart node-staging

            else

              echo "Application not found in PM2."
              echo "Starting application..."

              pm2 start npm \
                --name node-staging \
                -- start

            fi


            # ----------------------------------
            # Save PM2
            # ----------------------------------

            pm2 save


            echo "===================================="
            echo "Deployment completed successfully"
            echo "===================================="

            pm2 status